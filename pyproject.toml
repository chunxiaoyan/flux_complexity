[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flux_complexity"
version = "0.1.0"
description = "Dependency flux (size, weight) for syntactic complexity research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "conllu>=4.5",
]

[project.optional-dependencies]
parser = [
    "stanza>=1.9",
]
dev = [
    "pytest>=8",
    "networkx>=3",
]

[project.scripts]
fluxcalc = "flux_complexity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flux_complexity.norms" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
