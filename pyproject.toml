[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flux_complexity"
version = "0.1.0"
description = "Dependency flux (size, weight) for syntactic complexity research"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "conllu>=4.5",
]

[project.optional-dependencies]
parser = [
    "stanza>=1.9",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8",
    "networkx>=3",
    "httpx>=0.27",
]

[project.scripts]
fluxcalc = "flux_complexity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flux_complexity.norms" = ["data/*.json"]
"flux_complexity.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
